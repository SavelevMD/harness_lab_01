name: Agent Plan Act Evaluate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan-act-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan
        run: |
          mkdir -p traces
          cat > traces/agent-plan.json <<'PLAN'
          {
            "goal": "Evaluate this pull request with a bounded agent workflow.",
            "inputs": ["repository files", "pull request metadata"],
            "constraints": ["read-only contents permission", "human review before merge"],
            "actions": ["inspect changed files", "record traceability comment"],
            "successCriteria": ["plan artifact uploaded", "evaluation summary produced"]
          }
          PLAN

      - name: Act
        run: |
          git diff --name-only HEAD~1 HEAD > traces/changed-files.txt || true
          {
            echo "## Agent action trace"
            echo
            echo "Changed files considered:"
            sed 's/^/- /' traces/changed-files.txt || true
          } > traces/action-trace.md

      - name: Evaluate
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('traces/agent-plan.json','utf8')); if(!p.goal || !p.successCriteria.length) process.exit(1);"
          {
            echo "## Evaluation"
            echo
            echo "- Plan JSON parsed successfully."
            echo "- Trace files were created."
            echo "- Workflow used least-privilege permissions."
          } > traces/evaluation.md

      - name: Upload durable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-plan-act-evaluate-traces
          path: traces/

      - name: Traceability comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## Agent workflow traceability",
              "",
              "- Plan artifact: `agent-plan-act-evaluate-traces`",
              "- Lifecycle: Plan → Act → Evaluate",
              "- Permissions: contents read, pull-requests write, actions read",
              "- Human review remains required before merge"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });